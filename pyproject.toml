[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surf-forecast"
version = "0.1.0"
description = "Personalized surf forecast for La Paloma (first delivery)"
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2,<9",
    "tzdata",
]

[project.scripts]
surf-forecast = "surf_forecast.presentation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
